<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>notes — OSCP</title>
<style>
:root{
  --bg:#0a0e13; --card:#0f151d; --card2:#0b1016; --line:#1d2731; --line2:#2b3846;
  --fg:#c8d4e2; --dim:#7f8fa3; --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; padding:16px 16px 70px; max-width:1100px; margin-inline:auto;
  background:var(--bg); color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
a{color:var(--green)}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--dim)}

/* ---------- top bar ---------- */
.top{
  position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:12px;
  align-items:center; justify-content:space-between;
  padding:10px 12px; margin:-16px -16px 14px;
  background:rgba(10,14,19,.93); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand h1{margin:0;font-size:19px;letter-spacing:.2px;color:#e6eef8}
.brand h1::before{content:"$ ";color:var(--green);font-family:ui-monospace,monospace}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{
  appearance:none; cursor:pointer; font:inherit; font-size:13px; line-height:1;
  padding:8px 12px; border-radius:7px; border:1px solid var(--line2);
  background:#141c25; color:var(--fg); transition:.15s;
}
.btn:hover{background:#1a2431;border-color:#3a4b5d}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:progress}
.btn.primary{background:#12301c;border-color:#2c6a40;color:#9be8af}
.btn.primary:hover{background:#164024}
.btn.danger{color:#ffb4ae;border-color:#5a2b28;background:#22110f}
.btn.icon{padding:8px 9px;font-size:14px;display:inline-flex;align-items:center}
.btn.icon svg{display:block}
.status{
  font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim);
  padding:5px 9px; border:1px solid var(--line); border-radius:999px; background:#0d1319;
  max-width:46vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.status.ok{color:#8fe0a2;border-color:#264a31}
.status.busy{color:#e3c46a;border-color:#4a3f1d}
.status.err{color:#ff9d95;border-color:#5a2b28}
.status.warn{color:#e3c46a;border-color:#4a3f1d}

/* ---------- settings ---------- */
.settings{
  border:1px solid var(--line2); background:var(--card); border-radius:10px;
  padding:14px; margin:0 0 16px;
}
.settings[hidden]{display:none}
.settings .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.settings label.wide{grid-column:1/-1}
.settings input{
  font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace; color:#dbe7f4;
  background:#070b0f; border:1px solid var(--line); border-radius:6px; padding:8px 9px; width:100%;
}
.settings input:focus{outline:none;border-color:#2f6f4a}
.settingsActions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.settings .note{font-size:11.5px;color:var(--dim);flex:1 1 260px;line-height:1.4}

/* ---------- panels ---------- */
main{display:flex;flex-direction:column;gap:10px}
.panel{
  border:1px solid var(--line); border-radius:10px; background:var(--card); overflow:hidden;
}
.panel.is-dirty{border-color:#4a3f1d}
.phead{
  display:flex; align-items:center; gap:10px; padding:11px 13px; cursor:pointer;
  user-select:none; background:linear-gradient(180deg,#111822,#0e141b);
}
.phead:hover{background:#141d27}
.phead:focus-visible{outline:2px solid #2f6f4a;outline-offset:-2px}
.chev{
  width:0;height:0;flex:none;margin-right:2px;
  border-left:5px solid var(--green);
  border-top:4px solid transparent;
  border-bottom:4px solid transparent;
  transition:transform .12s;
}
.panel.open .chev{transform:rotate(90deg)}
.ptitle{margin:0;font-size:14.5px;font-weight:600;color:#dce7f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{
  font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;
}
.pacts{display:flex;gap:6px;flex:none;margin-left:auto}
.mini{
  cursor:pointer;font:11.5px system-ui,sans-serif;padding:5px 9px;border-radius:6px;
  border:1px solid var(--line2);background:#151e28;color:#b9c8d8;
}
.mini:hover{background:#1c2833;color:#e6eef8}
.mini.save{border-color:#2c6a40;color:#9be8af;background:#12301c}
.mini.save:hover{background:#16482a}

.pbody{padding:12px 13px 11px;border-top:1px solid var(--line);background:var(--card2)}
.pbody[hidden]{display:none}
.titlerow{display:flex;align-items:center;gap:8px;margin:0 0 9px}
.titlerow .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
.titleEdit{
  flex:1 1 auto; max-width:340px; font:12.5px system-ui,sans-serif; color:#dbe7f4;
  background:#070b0f;border:1px solid var(--line);border-radius:6px;padding:6px 8px;
}
.titleEdit:focus{outline:none;border-color:#2f6f4a}
textarea{
  display:block; width:100%;
  min-height:calc(15 * 1.55em + 20px);
  background:#060a0e; color:#d7e3f1;
  border:1px solid var(--line); border-radius:8px;
  font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  padding:10px 12px; resize:vertical; outline:none; tab-size:4;
}
textarea::placeholder{color:#4b5a6b}
textarea:focus{border-color:#2f6f4a; box-shadow:0 0 0 3px rgba(63,185,80,.10)}
.pfoot{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:11px;color:var(--dim)}
.dirt{color:var(--amber);display:none;font-weight:600;white-space:nowrap}
.panel.is-dirty .dirt{display:inline}

/* ---------- footer / toast ---------- */
.foot{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;
  margin-top:20px;padding-top:12px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--dim);
}
.toast{
  position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);
  background:#16202b;color:#e2ecf7;border:1px solid var(--line2);
  padding:10px 16px;border-radius:9px;font-size:13px;z-index:50;
  opacity:0;pointer-events:none;transition:.18s;max-width:min(560px,92vw);
  box-shadow:0 8px 26px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:#2c6a40;color:#b7f0c6}
.toast.err{border-color:#5a2b28;color:#ffb4ae}
.toast.warn{border-color:#4a3f1d;color:#f0d99a}

@media (max-width:620px){
  .status{max-width:100%;order:3;flex:1 1 100%}
  .pacts .mini{padding:5px 7px}
  .meta{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>notes</h1>
  </div>
  <div class="actions">
    <span id="status" class="status">…</span>
    <button id="btnSaveAll" class="btn primary" title="Save every box (Ctrl+S)">Save all</button>
    <button id="btnReload" class="btn" title="Pull the latest copy from GitHub">Reload</button>
    <button id="btnWrap" class="btn" title="Toggle line wrapping">Wrap: off</button>
    <button id="btnSettings" class="btn icon" title="GitHub settings" aria-label="Settings"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h9M17 6h4M3 12h3M11 12h10M3 18h11M19 18h2"/><circle cx="14" cy="6" r="3"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
  </div>
</header>

<section id="settings" class="settings" hidden>
  <div class="grid">
    <label>Owner<input id="cfgOwner" autocomplete="off" spellcheck="false" placeholder="AV10V"></label>
    <label>Repo<input id="cfgRepo" autocomplete="off" spellcheck="false" placeholder="OSCP"></label>
    <label>Branch<input id="cfgBranch" autocomplete="off" spellcheck="false" placeholder="main"></label>
    <label>File path<input id="cfgPath" autocomplete="off" spellcheck="false" placeholder="notes.json"></label>
    <label class="wide">Token — fine-grained PAT, this repo only, Contents: Read and write
      <input id="cfgToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    </label>
  </div>
  <div class="settingsActions">
    <button id="btnCfgSave" class="btn primary">Save settings</button>
    <button id="btnCfgTest" class="btn">Test connection</button>
    <button id="btnCfgForget" class="btn danger">Forget token</button>
    <span class="note">The token stays in this browser (localStorage) and is sent only to api.github.com. This repo is private, so <b>both reading and saving need it</b>.</span>
  </div>
</section>

<main id="panels"></main>

<footer class="foot">
  <span>repo <a id="repoLink" href="https://github.com/AV10V/OSCP" target="_blank" rel="noopener">AV10V/OSCP</a>
    · file <code id="pathLabel">notes.json</code></span>
  <span id="sizeLabel"></span>
</footer>

<div id="toast" class="toast" role="status"></div>
<noscript><p style="color:#f85149">This page needs JavaScript.</p></noscript>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ config */
const CFG_KEY   = 'oscpNotes.cfg.v1';
const CACHE_KEY = 'oscpNotes.cache.v1';
const OPEN_KEY  = 'oscpNotes.open.v1';
const DRAFT     = 'oscpNotes.draft.v1.';

const DEFAULTS = { owner:'AV10V', repo:'OSCP', branch:'main', path:'notes.json', token:'', wrap:false };

/* the six boxes; the last two are renameable */
const CANON = [
  { id:'ad',     title:'AD SET MS01, MS02, DC01' },
  { id:'linux1', title:'Linux 1' },
  { id:'linux2', title:'Linux 2' },
  { id:'win1',   title:'Windows 1' },
  { id:'extra1', title:'Additional 1', custom:true },
  { id:'extra2', title:'Additional 2', custom:true },
];

const $ = (sel, root=document) => root.querySelector(sel);

function loadJSON(key, fb){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; }
  catch (_) { return fb; }
}
function saveJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
}

const state = {
  cfg:  Object.assign({}, DEFAULTS, loadJSON(CFG_KEY, {})),
  doc:  blankDoc(),
  sha:  null,
  dirty:new Set(),
  open: new Set(loadJSON(OPEN_KEY, [])),
  busy: false,
};

const ui = new Map();          // id -> { root, head, body, chev, title, meta, ta, dirt, inp }
const panelsEl = $('#panels');
const draftTimers = new Map();

/* ------------------------------------------------------------------- model */
function blankDoc(){
  return { version:1, updatedAt:null, panels: CANON.map(p => ({
    id:p.id, title:p.title, text:'', updatedAt:null, custom:!!p.custom
  }))};
}

function normDoc(d){
  const base = blankDoc();
  if (!d || !Array.isArray(d.panels)) return base;
  const by = new Map(d.panels.filter(p => p && p.id).map(p => [p.id, p]));
  const out = [];
  for (const b of base.panels){
    const p = by.get(b.id);
    out.push({
      id: b.id,
      title: (p && p.title) || b.title,
      text: (p && typeof p.text === 'string') ? p.text : '',
      updatedAt: (p && p.updatedAt) || null,
      custom: !!b.custom || !!(p && p.custom),
      pending: !!(p && p.pending),
    });
    by.delete(b.id);
  }
  for (const [id, p] of by){
    if (p && typeof p.text === 'string'){
      out.push({ id, title: p.title || id, text: p.text, updatedAt: p.updatedAt || null, custom: true, pending: false });
    }
  }
  return { version:1, updatedAt: d.updatedAt || null, panels: out };
}

const findP = id => state.doc.panels.find(p => p.id === id);

/* --------------------------------------------------------------------- DOM */
function makePanel(p){
  const root = document.createElement('section');
  root.className = 'panel';
  root.dataset.id = p.id;

  const head = document.createElement('div');
  head.className = 'phead';
  head.tabIndex = 0;
  head.setAttribute('role', 'button');

  const chev  = document.createElement('span'); chev.className = 'chev';
  const title = document.createElement('h2');   title.className = 'ptitle';
  const meta  = document.createElement('span'); meta.className = 'meta';

  const acts  = document.createElement('div');  acts.className = 'pacts';
  const bSave = document.createElement('button'); bSave.className = 'mini save'; bSave.textContent = 'Save';
  const bCopy = document.createElement('button'); bCopy.className = 'mini';      bCopy.textContent = 'Copy';
  acts.append(bSave, bCopy);
  head.append(chev, title, meta, acts);

  const body = document.createElement('div');
  body.className = 'pbody';
  body.hidden = true;

  let inp = null;
  if (p.custom){
    const row = document.createElement('div'); row.className = 'titlerow';
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = 'box name';
    inp = document.createElement('input');
    inp.className = 'titleEdit'; inp.value = p.title; inp.spellcheck = false;
    inp.setAttribute('aria-label', 'Box name');
    inp.addEventListener('input', () => {
      const q = findP(p.id);
      if (!q) return;
      q.title = inp.value;
      title.textContent = inp.value || '(untitled)';
      markDirty(p.id);
      scheduleDraft(p.id);
    });
    row.append(lbl, inp);
    body.appendChild(row);
  }

  const ta = document.createElement('textarea');
  ta.rows = 15;
  ta.spellcheck = false;
  ta.wrap = state.cfg.wrap ? 'soft' : 'off';
  ta.placeholder = 'Paste terminal / tool output here, then press Save…';
  ta.addEventListener('input', () => {
    markDirty(p.id);
    scheduleDraft(p.id);
    updateMeta(p.id);
  });

  const foot = document.createElement('div'); foot.className = 'pfoot';
  const hint = document.createElement('span'); hint.className = 'hint';
  hint.textContent = 'Ctrl+S saves · draft kept in this browser';
  const dirt = document.createElement('span'); dirt.className = 'dirt'; dirt.textContent = 'unsaved';
  foot.append(hint, dirt);

  body.append(ta, foot);
  root.append(head, body);

  head.addEventListener('click', e => { if (e.target.closest('button')) return; toggle(p.id); });
  head.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(p.id); }
  });
  bSave.addEventListener('click', e => { e.stopPropagation(); save([p.id]); });
  bCopy.addEventListener('click', async e => {
    e.stopPropagation();
    try { await navigator.clipboard.writeText(ta.value); toast('Copied “' + title.textContent + '”', 'ok'); }
    catch (_) { ta.focus(); ta.select(); toast('Press Ctrl+C to copy', 'warn'); }
  });

  const box = { root, head, body, chev, title, meta, ta, dirt, inp };
  ui.set(p.id, box);
  return root;
}

function syncUI(){
  for (const p of state.doc.panels){
    let box = ui.get(p.id);
    if (!box){
      box = null;
      panelsEl.appendChild(makePanel(p));
      box = ui.get(p.id);
      if (box) box.root.dataset.id = p.id;
    }
    if (!box) continue;

    box.title.textContent = p.title || '(untitled)';
    if (box.inp && document.activeElement !== box.inp) box.inp.value = p.title;

    if (!state.dirty.has(p.id) && document.activeElement !== box.ta && box.ta.value !== p.text){
      box.ta.value = p.text;
    }

    const isOpen = state.open.has(p.id);
    box.body.hidden = !isOpen;
    box.head.setAttribute('aria-expanded', String(isOpen));
    box.root.classList.toggle('open', isOpen);

    updateMeta(p.id);
  }
  updateFooter();
}

function updateMeta(id){
  const p = findP(id), box = ui.get(id);
  if (!p || !box) return;
  const t = box.ta.value;
  const lines = t ? t.split('\n').length : 0;
  const isDirty = state.dirty.has(id);
  const saved = isDirty ? 'unsaved changes'
              : p.pending ? 'saved here · not synced'
              : (p.updatedAt ? 'saved ' + fmtTime(p.updatedAt) : 'not saved');
  box.meta.textContent = lines + ' lines · ' + t.length + ' chars · ' + saved;
  box.dirt.style.display = isDirty ? 'inline' : 'none';
  box.root.classList.toggle('is-dirty', isDirty);
}

function updateFooter(){
  let bytes = 0;
  for (const p of state.doc.panels) bytes += new Blob([p.text || '']).size;
  $('#sizeLabel').textContent = state.doc.updatedAt
    ? 'last saved ' + fmtTime(state.doc.updatedAt) + ' · ' + fmtBytes(bytes)
    : 'never saved · ' + fmtBytes(bytes);
  const { owner, repo, path } = state.cfg;
  $('#repoLink').textContent = owner + '/' + repo;
  $('#repoLink').href = 'https://github.com/' + owner + '/' + repo;
  $('#pathLabel').textContent = path;
}

function toggle(id){
  if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
  saveJSON(OPEN_KEY, [...state.open]);
  syncUI();
}

/* ------------------------------------------------------------------- dirty */
function markDirty(id){
  const p = findP(id), box = ui.get(id);
  if (!p || !box) return;
  const changed = box.ta.value !== p.text || (box.inp ? box.inp.value !== p.title : false);
  if (changed) state.dirty.add(id); else state.dirty.delete(id);
  updateMeta(id);
}

function scheduleDraft(id){
  clearTimeout(draftTimers.get(id));
  draftTimers.set(id, setTimeout(() => {
    const p = findP(id), box = ui.get(id);
    if (!p || !box) return;
    const text = box.ta.value;
    const title = box.inp ? box.inp.value : p.title;
    if (text === p.text && title === p.title){ localStorage.removeItem(DRAFT + id); return; }
    try { localStorage.setItem(DRAFT + id, JSON.stringify({ text, title })); } catch (_) {}
  }, 300));
}

function restoreDrafts(){
  for (const p of state.doc.panels){
    const box = ui.get(p.id);
    const d = loadJSON(DRAFT + p.id, null);
    if (!box || !d) continue;
    if (typeof d.text === 'string' && d.text !== p.text){
      box.ta.value = d.text;
      state.dirty.add(p.id);
    }
    if (box.inp && typeof d.title === 'string' && d.title){
      box.inp.value = d.title;
      box.title.textContent = d.title;
    }
  }
  syncUI();
}

/* ------------------------------------------------------------------ github */
function apiURL(withRef){
  const { owner, repo, branch, path } = state.cfg;
  const p = String(path).split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const base = 'https://api.github.com/repos/' + encodeURIComponent(owner) + '/' +
               encodeURIComponent(repo) + '/contents/' + p;
  if (!withRef) return base;
  return base + '?ref=' + encodeURIComponent(branch) + '&t=' + Date.now();
}
function headers(extra){
  const h = Object.assign({
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  }, extra || {});
  if (state.cfg.token) h['Authorization'] = 'Bearer ' + state.cfg.token.trim();
  return h;
}

async function errMsg(r){
  let m = '';
  try { const j = await r.json(); m = j.message || ''; } catch (_) {}
  if (r.status === 401) return 'token invalid or expired (401) — paste a new one in ⚙';
  if (r.status === 403) return 'permission denied or rate-limited (403)' + (m ? ' — ' + m : '');
  if (r.status === 404) return 'not found (404) — private repo without a valid token, or wrong repo/path';
  if (r.status === 451) return 'repository unavailable (451) — check the token\u2019s repository access';
  if (r.status === 409) return 'edit conflict (409)';
  if (r.status === 422) return 'rejected (422)' + (m ? ' — ' + m : '');
  return 'HTTP ' + r.status + (m ? ' — ' + m : '');
}

async function ghGet(){
  const url = apiURL(true);
  const r = await fetch(url, { headers: headers(), cache: 'no-store' });
  if (r.status === 404) return { exists:false, sha:null, text:null };
  if (!r.ok) throw new Error(await errMsg(r));
  const j = await r.json();
  let text = '';
  if (j.content && j.encoding === 'base64'){
    text = b64d(j.content);
  } else {
    const r2 = await fetch(url, { headers: headers({ 'Accept': 'application/vnd.github.raw' }), cache: 'no-store' });
    if (!r2.ok) throw new Error(await errMsg(r2));
    text = await r2.text();
  }
  return { exists:true, sha:j.sha, text };
}

async function ghPut(doc, sha, message){
  const url = apiURL(false);
  const body = {
    message: message || ('notes: save ' + new Date().toISOString().slice(0, 16).replace('T', ' ')),
    content: b64e(JSON.stringify(doc, null, 2)),
    branch: state.cfg.branch,
  };
  if (sha) body.sha = sha;

  const put = () => fetch(url, {
    method: 'PUT',
    headers: headers({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body),
  });

  let r = await put();
  if (r.status === 409){                 // someone else committed in between — retry once
    const cur = await ghGet();
    body.sha = cur.sha || undefined;
    r = await put();
  }
  if (!r.ok) throw new Error(await errMsg(r));
  const j = await r.json();
  return { sha: (j.content && j.content.sha) || null };
}

function b64e(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}
function b64d(b64){
  const bin = atob(String(b64).replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* -------------------------------------------------------------------- pull */
async function pull(manual){
  try {
    const r = await ghGet();
    if (!r.exists){
      if (!state.cfg.token){
        setStatus('private repo — add a token (\u2699)', 'warn');
        if (manual) toast('This repository is private: a token is required to read it', 'warn');
      } else {
        setStatus('no notes.json yet — first save creates it', 'warn');
        if (manual) toast('notes.json is not in the repo yet — the first Save creates it', 'warn');
      }
      return;
    }
    const remote = normDoc(JSON.parse(r.text || '{}'));
    state.sha = r.sha;

    const kept = [];
    for (const rp of remote.panels){
      const lp = findP(rp.id);
      if (!lp){ state.doc.panels.push(rp); continue; }
      if (state.dirty.has(rp.id) || lp.pending){ kept.push(rp.id); continue; }
      lp.text = rp.text; lp.title = rp.title;
      lp.updatedAt = rp.updatedAt; lp.custom = !!rp.custom; lp.pending = false;
    }
    state.doc.updatedAt = remote.updatedAt || state.doc.updatedAt;
    persistCache();
    syncUI();

    setStatus('synced · ' + fmtTime(state.doc.updatedAt), 'ok');
    if (manual) toast(kept.length
      ? 'Loaded from GitHub — kept ' + kept.length + ' box(es) that only exist on this machine (press Save all to push them)'
      : 'Loaded from GitHub', kept.length ? 'warn' : 'ok');
  } catch (err){
    console.warn(err);
    const m = String(err.message || '');
    const badToken = m.indexOf('401') >= 0 || m.indexOf('token') >= 0 || m.indexOf('404') >= 0;
    setStatus(badToken ? 'no access — check token in ⚙' : 'offline — showing this browser’s copy', 'err');
    if (manual) toast('Reload failed: ' + err.message, 'err');
  }
}

/* -------------------------------------------------------------------- save */
function snapshot(){
  const vals = new Map();
  for (const [id, box] of ui) vals.set(id, { text: box.ta.value, title: box.inp ? box.inp.value : undefined });
  return vals;
}

function mergeDoc(remoteDoc, targets, nowIso){
  const vals = snapshot();
  const tset = new Set(targets);
  const out = [];
  for (const lp of state.doc.panels){
    if (tset.has(lp.id)){
      const v = vals.get(lp.id) || {};
      out.push({
        id: lp.id,
        title: (v.title !== undefined ? v.title : lp.title) || lp.title,
        text:  v.text  !== undefined ? v.text  : lp.text,
        updatedAt: nowIso,
        custom: !!lp.custom,
        pending: false,
      });
    } else {
      const rp = remoteDoc.panels.find(x => x.id === lp.id);
      out.push(rp ? Object.assign({}, rp) : JSON.parse(JSON.stringify(lp)));
    }
  }
  for (const rp of remoteDoc.panels){
    if (!out.some(x => x.id === rp.id)) out.push(Object.assign({}, rp));
  }
  return { version:1, updatedAt: nowIso, panels: out };
}

function commitLocal(targets, nowIso){
  const vals = snapshot();
  const tset = new Set(targets);
  state.doc.panels = state.doc.panels.map(lp => {
    if (!tset.has(lp.id)) return lp;
    const v = vals.get(lp.id) || {};
    return {
      id: lp.id,
      title: (v.title !== undefined ? v.title : lp.title) || lp.title,
      text:  v.text  !== undefined ? v.text  : lp.text,
      updatedAt: nowIso,
      custom: !!lp.custom,
      pending: true,
    };
  });
  state.doc.updatedAt = nowIso;
  for (const id of targets){ state.dirty.delete(id); localStorage.removeItem(DRAFT + id); }
  syncUI();
}

async function save(ids){
  if (state.busy) return;
  const targets = ids === 'all' ? state.doc.panels.map(p => p.id) : ids.slice();
  if (!targets.length) return;
  const nowIso = new Date().toISOString();

  if (!state.cfg.token){
    commitLocal(targets, nowIso);
    persistCache();
    toast('Saved in this browser only — add a token (⚙) to sync to GitHub', 'warn');
    setStatus('local only · no token', 'warn');
    return;
  }

  setBusy(true);
  setStatus('saving…', 'busy');
  try {
    const remote = await ghGet();
    const remoteDoc = remote.exists ? normDoc(JSON.parse(remote.text || '{}')) : blankDoc();

    /* notice if a newer version of a box we are about to overwrite exists remotely */
    const overwritten = [];
    for (const id of targets){
      const rp = remoteDoc.panels.find(x => x.id === id);
      const lp = findP(id);
      if (rp && rp.updatedAt && lp && lp.updatedAt && new Date(rp.updatedAt) > new Date(lp.updatedAt)) overwritten.push(rp.title || rp.id);
    }

    const merged = mergeDoc(remoteDoc, targets, nowIso);
    const names = targets.map(id => { const q = findP(id); return q ? q.title : id; }).join(', ');
    const msg = 'notes: ' + (names.length > 60 ? names.slice(0, 57) + '…' : names) +
                (targets.length > 1 ? ' (' + targets.length + ' boxes)' : '') +
                ' — ' + nowIso.slice(0, 16).replace('T', ' ');
    const res = await ghPut(merged, remote.sha, msg);

    state.sha = res.sha || state.sha;
    state.doc = merged;
    for (const id of targets){ state.dirty.delete(id); localStorage.removeItem(DRAFT + id); }
    persistCache();
    syncUI();

    const label = targets.length === 1
      ? (findP(targets[0]) ? findP(targets[0]).title : 'box')
      : targets.length + ' boxes';
    setStatus('synced · ' + fmtTime(nowIso), 'ok');
    toast('Saved ' + label + ' · ' + fmtTime(nowIso) +
          (overwritten.length ? ' — note: remote had a newer copy of ' + overwritten.join(', ') : ''),
          overwritten.length ? 'warn' : 'ok');
  } catch (err){
    console.error(err);
    setStatus('save failed', 'err');
    toast('Save failed: ' + err.message, 'err');
  } finally {
    setBusy(false);
  }
}

function persistCache(){ saveJSON(CACHE_KEY, state.doc); }

function setBusy(b){
  state.busy = b;
  $('#btnSaveAll').disabled = b;
  $('#btnReload').disabled = b;
}

/* --------------------------------------------------------------- helpers UI */
function setStatus(text, kind){
  const el = $('#status');
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

let toastTimer;
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 5000);
}

function fmtTime(iso){
  if (!iso) return 'never';
  const d = new Date(iso);
  if (isNaN(d)) return 'never';
  return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

/* ------------------------------------------------------------------ settings */
function fillSettings(){
  $('#cfgOwner').value  = state.cfg.owner;
  $('#cfgRepo').value   = state.cfg.repo;
  $('#cfgBranch').value = state.cfg.branch;
  $('#cfgPath').value   = state.cfg.path;
  $('#cfgToken').value  = state.cfg.token;
}

function readSettings(){
  state.cfg.owner  = $('#cfgOwner').value.trim()  || DEFAULTS.owner;
  state.cfg.repo   = $('#cfgRepo').value.trim()   || DEFAULTS.repo;
  state.cfg.branch = $('#cfgBranch').value.trim() || DEFAULTS.branch;
  state.cfg.path   = $('#cfgPath').value.trim()   || DEFAULTS.path;
  state.cfg.token  = $('#cfgToken').value.trim();
  saveJSON(CFG_KEY, state.cfg);
  updateFooter();
}

function applyWrap(){
  for (const [, box] of ui) box.ta.wrap = state.cfg.wrap ? 'soft' : 'off';
  $('#btnWrap').textContent = 'Wrap: ' + (state.cfg.wrap ? 'on' : 'off');
}

/* --------------------------------------------------------------------- boot */
function boot(){
  const cached = loadJSON(CACHE_KEY, null);
  state.doc = cached ? normDoc(cached) : blankDoc();

  buildAll();
  restoreDrafts();
  applyWrap();
  fillSettings();
  updateFooter();

  if (!state.cfg.token) $('#settings').hidden = false;   // private repo: token first
  setStatus(state.cfg.token ? 'loading…' : 'private repo — add a token (\u2699)', state.cfg.token ? 'busy' : 'warn');
  pull(false);
}

function buildAll(){
  panelsEl.textContent = '';
  ui.clear();
  for (const p of state.doc.panels){
    const root = makePanel(p);
    panelsEl.appendChild(root);
  }
  syncUI();
}

/* -------------------------------------------------------------------- events */
$('#btnSaveAll').addEventListener('click', () => save('all'));
$('#btnReload').addEventListener('click', () => pull(true));
$('#btnWrap').addEventListener('click', () => {
  state.cfg.wrap = !state.cfg.wrap;
  saveJSON(CFG_KEY, state.cfg);
  applyWrap();
});
$('#btnSettings').addEventListener('click', () => {
  const s = $('#settings');
  s.hidden = !s.hidden;
  if (!s.hidden) fillSettings();
});
$('#btnCfgSave').addEventListener('click', () => {
  readSettings();
  toast('Settings saved', 'ok');
  setStatus('settings saved — reloading…', 'busy');
  pull(true);
});
$('#btnCfgTest').addEventListener('click', async () => {
  readSettings();
  setStatus('testing…', 'busy');
  try {
    const r = await ghGet();
    if (!r.exists){ setStatus('reachable — file not created yet', 'warn'); toast('Connection OK. notes.json does not exist yet — the first Save creates it.', 'warn'); }
    else { setStatus('reachable · file found', 'ok'); toast('Connection OK. File found in ' + state.cfg.owner + '/' + state.cfg.repo, 'ok'); }
  } catch (err){
    setStatus('connection failed', 'err');
    toast('Connection failed: ' + err.message, 'err');
  }
});
$('#btnCfgForget').addEventListener('click', () => {
  state.cfg.token = '';
  $('#cfgToken').value = '';
  saveJSON(CFG_KEY, state.cfg);
  setStatus('local only · no token', 'warn');
  toast('Token removed from this browser', 'ok');
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault();
    save('all');
  }
});

window.addEventListener('online',  () => pull(false));
window.addEventListener('storage', e => {
  if (e.key === CACHE_KEY && e.newValue){
    try { state.doc = normDoc(JSON.parse(e.newValue)); syncUI(); } catch (_) {}
  }
});

/* saved-in-another-tab hint */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.cfg.token && !state.dirty.size) pull(false);
});

boot();
})();
</script>
</body>
</html>
